<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع QWS المتكامل</title>
    <style>
        :root { --main: #8a2be2; --bg: #121214; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { width: 350px; background: #1e1e24; padding: 20px; border-radius: 20px; border: 1px solid var(--main); }
        .screen { display: none; } .active { display: block; }
        button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: var(--main); color: #fff; font-weight: bold; cursor: pointer; }
        .stats { display: flex; justify-content: space-between; background: #000; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .cell { width: 90px; height: 90px; background: #2a2a32; display: inline-block; font-size: 30px; text-align: center; line-height: 90px; cursor: pointer; border-radius: 8px; margin: 3px; }
    </style>
</head>
<body>

<div class="box">
    <!-- 1. شاشة الترحيب -->
    <div id="welcome" class="screen active">
        <h1>مرحباً بك في QWS</h1>
        <button onclick="show('login')">تسجيل الدخول / إنشاء حساب</button>
    </div>

    <!-- 2. تسجيل الدخول -->
    <div id="login" class="screen">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم" style="width:100%; padding:10px; margin-bottom:10px;">
        <button onclick="login()">دخول</button>
    </div>

    <!-- 3. لوحة التحكم (الرئيسية) -->
    <div id="dashboard" class="screen">
        <div class="stats">
            <span>نقاط: <span id="pts">0</span></span>
            <span>ليفل: <span id="lvl">1</span></span>
            <span>رتبة: <span id="rank">مبتدئ</span></span>
        </div>
        <button onclick="show('game')">ابدأ لعبة X-O</button>
        <button onclick="show('shop')">المتجر والشارات</button>
    </div>

    <!-- 4. اللعبة -->
    <div id="game" class="screen">
        <h3>لعبة X-O</h3>
        <div id="board">
            <div class="cell" onclick="move(0)"></div><div class="cell" onclick="move(1)"></div><div class="cell" onclick="move(2)"></div>
            <div class="cell" onclick="move(3)"></div><div class="cell" onclick="move(4)"></div><div class="cell" onclick="move(5)"></div>
            <div class="cell" onclick="move(6)"></div><div class="cell" onclick="move(7)"></div><div class="cell" onclick="move(8)"></div>
        </div>
        <button onclick="show('dashboard')">رجوع</button>
    </div>

    <!-- 5. المتجر -->
    <div id="shop" class="screen">
        <h2>المتجر</h2>
        <p>اشترِ شارات الفخر لزيادة مستواك!</p>
        <button onclick="buy('شارة النجم', 50)">شراء "شارة النجم" (50 نقطة)</button>
        <button onclick="show('dashboard')">رجوع</button>
    </div>
</div>

<script>
    let points = 0; let level = 1; let board = ["","","","","","","","",""];
    
    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function login() { show('dashboard'); }

    function move(i) {
        if(board[i] == "") {
            board[i] = "X";
            document.querySelectorAll('.cell')[i].innerText = "X";
            points += 10;
            updateStats();
            if(points >= 100) level = 2;
            alert("ربحت 10 نقاط!");
        }
    }

    function updateStats() {
        document.getElementById('pts').innerText = points;
        document.getElementById('lvl').innerText = level;
        document.getElementById('rank').innerText = level > 1 ? "محترف" : "مبتدئ";
    }

    function buy(item, cost) {
        if(points >= cost) {
            points -= cost;
            alert("تم شراء " + item);
            updateStats();
        } else {
            alert("نقاطك غير كافية!");
        }
    }
</script>
</body>
</html>
