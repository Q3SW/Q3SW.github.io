<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWS | Official Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('https://i.ibb.co/gMz0BG4p/background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: rgba(15, 15, 18, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        p.bio {
            font-size: 15px;
            color: #d1d1d1;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .link-btn {
            display: block;
            background: rgba(26, 26, 36, 0.85);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid rgba(138, 43, 226, 0.4);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #8a2be2;
            border-color: #8a2be2;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.5);
        }

        /* قسم التقييمات */
        .rating-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            margin-top: 10px;
        }

        .rating-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            direction: ltr;
        }

        .star {
            font-size: 28px;
            color: #444;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .star.active, .star:hover {
            color: #ffca28;
        }

        .rating-btn {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            margin: 4px;
        }

        .rating-btn:hover {
            background: #6a1b9a;
        }

        .reviews-display {
            display: none;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            color: #b3b3b3;
            max-height: 120px;
            overflow-y: auto;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الشخصية -->
        <img class="profile-img" src="https://i.ibb.co/ZpyBD46y/profile.jpg" alt="QWS">

        <!-- الاسم والوصف -->
        <h1>QWS</h1>
        <p class="bio">مرحباً في موقع QWS</p>

        <!-- الأزرار والروابط -->
        <div class="links-container">
            <a href="https://t.me/qwqqh" target="_blank" class="link-btn">حسابي في Telegram</a>
            <a href="https://www.tiktok.com/@www.google.org" target="_blank" class="link-btn">حسابي في TikTok</a>
            <a href="https://discord.com/users/sx_sz" target="_blank" class="link-btn">حسابي في Discord (sx_sz)</a>
            <a href="https://github.com/Q3WS" target="_blank" class="link-btn">حسابي في GitHub</a>
        </div>

        <!-- قسم التقييم بالنجوم -->
        <div class="rating-section">
            <div class="rating-title">قيم موقع QWS:</div>
            <div class="stars" id="starContainer">
                <span class="star" onclick="setRating(1)">★</span>
                <span class="star" onclick="setRating(2)">★</span>
                <span class="star" onclick="setRating(3)">★</span>
                <span class="star" onclick="setRating(4)">★</span>
                <span class="star" onclick="setRating(5)">★</span>
            </div>

            <button class="rating-btn" onclick="submitRating()">إرسال التقييم</button>
            <button class="rating-btn" style="background: rgba(255,255,255,0.1);" onclick="toggleReviews()">عرض التقييمات</button>

            <div class="reviews-display" id="reviewsBox">
                <p>⭐ متوسط التقييمات: <span id="avgRating">5.0</span> / 5</p>
                <p style="font-size: 12px; margin-top: 5px; color: #888;">إجمالي التقييمات المخزنة: <span id="totalCount">1</span></p>
            </div>
        </div>
    </div>

    <script>
        let currentRating = 0;

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitRating() {
            if (currentRating === 0) {
                alert('يرجى تحديد عدد النجوم أولاً!');
                return;
            }
            
            // حفظ التقييم في المتصفح المحلي
            let savedRatings = JSON.parse(localStorage.getItem('qws_ratings')) || [5];
            savedRatings.push(currentRating);
            localStorage.setItem('qws_ratings', JSON.stringify(savedRatings));

            alert('شكراً لك! تم إرسال تقييمك بـ ' + currentRating + ' نجوم.');
            updateReviews();
        }

        function toggleReviews() {
            const box = document.getElementById('reviewsBox');
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
                updateReviews();
            }
        }

        function updateReviews() {
            let savedRatings = JSON.parse(localStorage.getItem('qws_ratings')) || [5];
            let sum = savedRatings.reduce((a, b) => a + b, 0);
            let avg = (sum / savedRatings.length).toFixed(1);

            document.getElementById('avgRating').innerText = avg;
            document.getElementById('totalCount').innerText = savedRatings.length;
        }
    </script>

</body>
</html>
