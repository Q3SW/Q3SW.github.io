<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWS | Official Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية الموقع مع طبقة غمقان خفيفة حتى تبرز الأزرار والكلام */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('https://i.ibb.co/gMz0BG4p/background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: rgba(15, 15, 18, 0.75);
            padding: 30px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        p.bio {
            font-size: 15px;
            color: #d1d1d1;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: block;
            background: rgba(26, 26, 36, 0.85);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid rgba(138, 43, 226, 0.4);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #8a2be2;
            border-color: #8a2be2;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الشخصية في الأعلى -->
        <img class="profile-img" src="https://i.ibb.co/ZpyBD46y/profile.jpg" alt="Qws_">

        <!-- الاسم والوصف -->
        <h1>Qws_</h1>
        <p class="bio">مرحباً في موقع QWS</p>

        <!-- الأزرار والروابط -->
        <div class="links-container">
            <a href="https://t.me/qwqqh" target="_blank" class="link-btn">قناة Telegram</a>
            <a href="https://www.tiktok.com/@www.google.org" target="_blank" class="link-btn">حسابي في TikTok</a>
            <a href="https://discord.com/users/sx_sz" target="_blank" class="link-btn">حسابي في Discord (sx_sz)</a>
        </div>
    </div>

</body>
</html>
