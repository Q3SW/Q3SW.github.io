<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWS | Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'system-ui', -apple-system, sans-serif;
        }

        body {
            background: #090d16;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متوهجة متحركة */
        .glow-1, .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
        }
        .glow-1 {
            background: #6366f1;
            top: 10%;
            right: 15%;
        }
        .glow-2 {
            background: #ec4899;
            bottom: 10%;
            left: 15%;
        }

        /* كارت زجاجي احترافي */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        h2 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 6px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #ffffff;
            color: #090d16;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="card">
        <div class="avatar">Q</div>
        <h2>Qws_</h2>
        <p>صانع محتوى ومطور أفكار رقمية</p>
        
        <div class="links">
            <a href="#" class="btn">قناة التيكتوك</a>
            <a href="#" class="btn">مشارييعي على GitHub</a>
            <a href="#" class="btn">تواصل معي</a>
        </div>
    </div>

</body>
</html>
