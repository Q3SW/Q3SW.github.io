<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qws_ | Linktree</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #8a2be2;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: block;
            background: #1a1a24;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #2a2a3a;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #8a2be2;
            border-color: #8a2be2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الشخصية -->
        <img class="profile-img" src="https://via.placeholder.com/150" alt="Qws_">

        <!-- الاسم والبايو -->
        <h1>Qws_</h1>
        <p class="bio">أهلاً بكم في صفختي الشخصية</p>

        <!-- الأزرار والروابط -->
        <div class="links-container">
            <a href="https://t.me/qwqqh" target="_blank" class="link-btn">قناة Telegram</a>
            <a href="https://www.tiktok.com/@www.google.org" target="_blank" class="link-btn">حسابي في TikTok</a>
            <a href="https://discord.com/users/sx_sz" target="_blank" class="link-btn">حسابي في Discord (sx_sz)</a>
        </div>
    </div>

</body>
  </html>
