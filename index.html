<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ألعاب QWS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #121214; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 420px; background: #1e1e24; padding: 20px; border-radius: 16px; border: 1px solid #8a2be2; text-align: center; }
        .hidden { display: none !important; }
        .btn { background: #8a2be2; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-alt { background: #2a2a32; border: 1px solid #444; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #8a2be2; background: #000; color: #fff; text-align: center; }
        .card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .cell { height: 75px; background: #2a2a32; border-radius: 8px; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #a855f7; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. الشاشة الأولى -->
        <div id="startScreen">
            <h2 style="margin-bottom:15px;">مرحباً في موقع ألعاب QWS ⚙️</h2>
            <button class="btn" onclick="showWelcomeOrAuth()">متابعة</button>
        </div>

        <!-- 2. شاشة التسجيل -->
        <div id="authScreen" class="hidden">
            <h3>تسجيل الحساب</h3>
            <p style="font-size:12px; color:#aaa; margin: 10px 0;">أدخل المعرف وكلمة السر</p>
            <input type="number" id="accId" placeholder="المعرف (ID)">
            <input type="password" id="accPass" placeholder="كلمة السر">
            <button class="btn" onclick="login()">إنشاء حساب / دخول</button>
        </div>

        <!-- 3. شاشة الترحيب المخصصة -->
        <div id="welcomeScreen" class="hidden">
            <h3 id="welcomeText" style="margin-bottom:15px;"></h3>
            <button class="btn" onclick="showScreen('dashScreen')">متابعة للرئيسية</button>
        </div>

        <!-- 4. الرئيسية -->
        <div id="dashScreen" class="hidden">
            <div style="background:rgba(138,43,226,0.1); padding:10px; border-radius:10px; margin-bottom:15px; text-align:right;">
                <p>👤 المعرف: <strong id="uId"></strong></p>
                <p>⭐ الليفل: <strong id="uLvl">1</strong> | 🎖️ الشارة: <strong id="uBadge" style="color:#ffca28;">مبتدئ</strong></p>
                <p>🏆 النقاط: <strong id="uPts">0</strong> | 🔥 الفخر: <strong id="uHonor">0</strong></p>
            </div>

            <button class="btn" onclick="startXO()">لعبة XO (ضد الروبوت)</button>
            <button class="btn btn-alt" style="background:#059669;" onclick="spinWheel()">عجلة الحظ 🎡 (كل يومين)</button>
            <button class="btn btn-alt" onclick="showShop()">المتجر 🛒</button>
            <button class="btn btn-alt" style="background:#b91c1c; margin-top:15px;" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- 5. المتجر -->
        <div id="shopScreen" class="hidden">
            <h3>المتجر 🛒</h3>
            <p style="font-size:12px; color:#aaa; margin-bottom:15px;">نقاطك الحالية: <span id="shopPts">0</span></p>

            <div class="card">
                <div>مضاعف النقاط 2x (100 نقطة)</div>
                <button class="btn" style="width:auto; padding:5px 10px;" onclick="buyDouble()">شراء</button>
            </div>
            <div class="card">
                <div>شاشة "نجم مبارز" (20 نقطة)</div>
                <button class="btn" style="width:auto; padding:5px 10px;" onclick="buyWelcome(20, 'مرحباً بك يا نجم مبارز في موقع QWS!')">شراء</button>
            </div>
            <div class="card">
                <div>شاشة "نجمنا الكبير" (50 نقطة)</div>
                <button class="btn" style="width:auto; padding:5px 10px;" onclick="buyWelcome(50, 'أهلاً بك يا نجمنا الكبير في موقع QWS!')">شراء</button>
            </div>

            <button class="btn btn-alt" style="margin-top:15px;" onclick="showScreen('dashScreen')">الرجوع للرئيسية</button>
        </div>

        <!-- 6. لعبة XO -->
        <div id="xoScreen" class="hidden">
            <h3 id="xoStatus">دورك الان (X)</h3>
            <div class="board">
                <div class="cell" onclick="play(0)"></div>
                <div class="cell" onclick="play(1)"></div>
                <div class="cell" onclick="play(2)"></div>
                <div class="cell" onclick="play(3)"></div>
                <div class="cell" onclick="play(4)"></div>
                <div class="cell" onclick="play(5)"></div>
                <div class="cell" onclick="play(6)"></div>
                <div class="cell" onclick="play(7)"></div>
                <div class="cell" onclick="play(8)"></div>
            </div>
            <button class="btn btn-alt" onclick="resetXO()">إعادة اللعب</button>
            <button class="btn" onclick="showScreen('dashScreen')">الرجوع للرئيسية</button>
        </div>
    </div>

    <script>
        let user = JSON.parse(localStorage.getItem('qws_active_user')) || null;
        let board = ["","","","","","","","",""];
        let active = true;
        let winsCounter = 0;

        function showScreen(id) {
            document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showWelcomeOrAuth() {
            if (user) {
                document.getElementById('welcomeText').innerText = user.welcomeMsg || 'مرحباً بك في موقع ألعاب QWS!';
                showScreen('welcomeScreen');
            } else {
                showScreen('authScreen');
            }
        }

        function login() {
            let id = document.getElementById('accId').value;
            let pass = document.getElementById('accPass').value;
            if (!id || !pass) return alert('يرجى كتابة المعرف وكلمة السر!');

            user = {
                id: id, pass: pass, pts: 0, honor: 0, lvl: 1, 
                multiplier: 1, welcomeMsg: 'مرحباً بك في موقع ألعاب QWS!', lastWheel: 0
            };
            saveData();
            updateUI();
            showWelcomeOrAuth();
        }

        function getBadge(lvl) {
            if (lvl >= 80) return 'لانهائي ♾️';
            if (lvl >= 50) return 'نجم ⭐';
            if (lvl >= 35) return 'مخضرم 🥇';
            if (lvl >= 25) return 'محارب فضي 🥈';
            if (lvl >= 15) return 'مبارز برونزي 🥉';
            return 'مبتدئ 🌱';
        }

        function updateUI() {
            if (!user) return;
            document.getElementById('uId').innerText = user.id;
            document.getElementById('uLvl').innerText = user.lvl;
            document.getElementById('uBadge').innerText = getBadge(user.lvl);
            document.getElementById('uPts').innerText = user.pts;
            document.getElementById('uHonor').innerText = user.honor;
            document.getElementById('shopPts').innerText = user.pts;
        }

        function spinWheel() {
            let now = Date.now();
            if (user.lastWheel && (now - user.lastWheel < 172800000)) {
                return alert('عجلة الحظ تفتح مرة كل يومين (48 ساعة)!');
            }
            let r = Math.random() * 100;
            let gain = r < 70 ? 5 : r < 90 ? 8 : r < 98 ? 20 : 50;
            user.pts += gain;
            user.lastWheel = now;
            saveData(); updateUI();
            alert('🎉 مبروك! حصلت على ' + gain + ' نقطة من عجلة الحظ.');
        }

        function showShop() { updateUI(); showScreen('shopScreen'); }

        function buyDouble() {
            if (user.pts < 100) return alert('نقاطك غير كافية!');
            if (user.multiplier === 2) return alert('الميزة مفعلة لديك مسبقاً!');
            user.pts -= 100; user.multiplier = 2;
            saveData(); updateUI(); alert('تم تفعيل مضاعف النقاط 2x!');
        }

        function buyWelcome(cost, msg) {
            if (user.pts < cost) return alert('نقاطك غير كافية!');
            user.pts -= cost; user.welcomeMsg = msg;
            saveData(); updateUI(); alert('تم شراء شاشة الترحيب بنجاح!');
        }

        function startXO() { resetXO(); showScreen('xoScreen'); }

        function play(i) {
            if (board[i] !== "" || !active) return;
            board[i] = "X";
            render();

            if (checkWin("X")) {
                let gain = 5 * user.multiplier;
                user.pts += gain;
                user.honor += gain;
                winsCounter++;

                if (winsCounter >= 3) {
                    user.lvl += 1;
                    winsCounter = 0;
                    alert('🔥 أداء ممتاز! زدت ليفل جديد!');
                }

                document.getElementById('xoStatus').innerText = 'فزت! 🎉 (+' + gain + ' نقطة)';
                active = false; saveData(); updateUI(); return;
            }

            if (!board.includes("")) {
                document.getElementById('xoStatus').innerText = 'تعادل!';
                active = false; return;
            }

            document.getElementById('xoStatus').innerText = 'دور الروبوت...';
            setTimeout(botPlay, 300);
        }

        function botPlay() {
            let empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                let move = empty[Math.floor(Math.random() * empty.length)];
                board[move] = "O";
                render();

                if (checkWin("O")) {
                    user.honor = Math.max(0, user.honor - 3);
                    document.getElementById('xoStatus').innerText = 'خسرت! 💔 (-3 فخر)';
                    active = false; saveData(); updateUI(); return;
                }
                document.getElementById('xoStatus').innerText = 'دورك الان (X)';
            }
        }

        function checkWin(p) {
            let w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(c => c.every(i => board[i] === p));
        }

        function render() {
            document.querySelectorAll('.cell').forEach((c, i) => c.innerText = board[i]);
        }

        function resetXO() {
            board = ["","","","","","","","",""];
            active = true;
            document.getElementById('xoStatus').innerText = 'دورك الان (X)';
            render();
        }

        function logout() { localStorage.removeItem('qws_active_user'); location.reload(); }
        function saveData() { localStorage.setItem('qws_active_user', JSON.stringify(user)); }

        window.onload = function() {
            if (user) updateUI();
        };
    </script>
</body>
</html>
