<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة QWS</title>
    <style>
        :root { --main: #8a2be2; --bg: #121214; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 350px; background: #1e1e24; padding: 20px; border-radius: 20px; border: 2px solid var(--main); }
        .screen { display: none; } .active { display: block; }
        button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 10px; border: none; background: var(--main); color: #fff; font-weight: bold; cursor: pointer; }
        .cell { width: 100px; height: 100px; background: #2a2a32; display: inline-block; font-size: 40px; text-align: center; line-height: 100px; cursor: pointer; border-radius: 10px; margin: 2px; color: #fff; }
        .win-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; flex-direction: column; z-index: 10; }
    </style>
</head>
<body>

<div class="box">
    <!-- الشاشة الرئيسية -->
    <div id="home" class="screen active">
        <h1>لعبة QWS</h1>
        <button onclick="show('game')">بدء التحدي</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="game" class="screen">
        <h3 id="statusText">دورك (X)</h3>
        <div id="board">
            <div class="cell" onclick="move(0)"></div><div class="cell" onclick="move(1)"></div><div class="cell" onclick="move(2)"></div>
            <div class="cell" onclick="move(3)"></div><div class="cell" onclick="move(4)"></div><div class="cell" onclick="move(5)"></div>
            <div class="cell" onclick="move(6)"></div><div class="cell" onclick="move(7)"></div><div class="cell" onclick="move(8)"></div>
        </div>
        <button onclick="show('home')">الخروج</button>
    </div>
</div>

<!-- شاشة الفوز -->
<div id="winPop" class="win-screen">
    <h1 style="color: gold; font-size: 50px;">BOOYAH!</h1>
    <button style="width: 200px;" onclick="closeWin()">استمرار</button>
</div>

<script>
    let board = ["","","","","","","","",""];
    let isPlayerTurn = true;
    let difficulty = 0; // تزداد مع كل فوز

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function move(i) {
        if(board[i] == "" && isPlayerTurn) {
            board[i] = "X";
            updateBoard();
            if(checkWinner("X")) {
                document.getElementById('winPop').style.display = 'flex';
                playWinSound();
            } else {
                isPlayerTurn = false;
                document.getElementById('statusText').innerText = "الخصم يفكر...";
                setTimeout(botMove, 800);
            }
        }
    }

    function botMove() {
        let empty = board.map((v,i) => v==""?i:null).filter(v=>v!=null);
        let move;
        
        // ذكاء اصطناعي بسيط: يمنع فوزك أو يحاول الفوز
        if(Math.random() < (0.3 + (difficulty * 0.1))) {
            move = empty[Math.floor(Math.random()*empty.length)]; // عشوائي
        } else {
            move = empty[Math.floor(Math.random()*empty.length)]; // هنا يمكنك تطويره مستقبلاً
        }

        board[move] = "O";
        updateBoard();
        if(checkWinner("O")) {
            alert("لقد فاز الخصم!");
            resetGame();
        } else {
            isPlayerTurn = true;
            document.getElementById('statusText').innerText = "دورك (X)";
        }
    }

    function checkWinner(p) {
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,6,4]];
        return wins.some(c => c.every(i => board[i] == p));
    }

    function updateBoard() {
        let cells = document.querySelectorAll('.cell');
        board.forEach((v,i) => cells[i].innerText = v);
    }

    function playWinSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function closeWin() {
        document.getElementById('winPop').style.display = 'none';
        difficulty++; // زيادة الصعوبة
        resetGame();
    }

    function resetGame() {
        board = ["","","","","","","","",""];
        isPlayerTurn = true;
        document.getElementById('statusText').innerText = "دورك (X)";
        updateBoard();
    }
</script>
</body>
</html>
